name: n8n-prod

services:
  n8n-postgres:
    image: postgres:16-alpine
    container_name: n8n-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - n8n_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-prod-n8n
    restart: unless-stopped
    env_file: .env
    depends_on:
      n8n-postgres:
        condition: service_healthy
    volumes:
      - ./n8n_data:/home/node/.n8n
    networks:
      - n8n_internal
      - miniappify_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.miniappify.vn`)"
      - "traefik.http.routers.n8n.entrypoints=web"
      - "traefik.http.routers.n8n.middlewares=secure-headers@file"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  fb-scraper:
    build:
      context: ./fb-scraper
      dockerfile: Dockerfile
    container_name: n8n-prod-fb-scraper
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./fb_scraper_data:/app/browser_data
    networks:
      - n8n_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3


networks:
  n8n_internal:
    driver: bridge
  miniappify_net:
    external: true
    name: miniappify-prod_miniappify_net
